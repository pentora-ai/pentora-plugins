name: Generate Plugin Manifest
on:
  push:
    paths:
      - '**/*.yaml'
      - '!manifest.yaml'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Clone pentora repo
        run: git clone https://github.com/pentora-ai/pentora.git
      - name: Generate manifest
        run: |
          go run pentora/cmd/tools/manifest-generator/main.go \
            -dir . \
            -output manifest.yaml \
            -base-url https://plugins.pentora.ai
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml
          git commit -m "chore: auto-generate manifest.yaml" || exit 0
          git push